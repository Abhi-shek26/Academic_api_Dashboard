services:
  - type: web
    name: academic-api-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false # set in Render dashboard (MongoDB Atlas connection string)
      - key: REDIS_URL
        sync: false # OPTIONAL: leave unset to run without Redis; set to Upstash/Redis Cloud URL to enable cache
      - key: ADMIN_API_KEY
        generateValue: true
      - key: RATE_LIMIT_MAX
        value: 60
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
